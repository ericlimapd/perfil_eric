<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <title>Eric Lima</title>
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar">
                <a href="#" class="logo">Eric Lima</a>

                <ul class="nav-links">
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#projetos">Projetos</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section id="home">
            <div class="container">

                <div class="hero">
        
                    <div class="hero-content">
                        <p class="hero-intro">
                            Olá, eu sou
                        </p>
        
                        <h1>
                            Eric Lima
                        </h1>
        
                        <h2>
                            Desenvolvedor <span>Full-Stack</span>
                        </h2>
        
                        <p class="hero-description">
                            Sou estudante de desenvolvimento Full-Stack e apaixonado por criar aplicações modernas, responsivas e com foco na experiência do usuário.
                        </p>
        
                        <div class="hero-buttons">
                            <a href="#projetos" class="btn-primary">
                                Ver Projetos
                            </a>
                            <a href="#contato" class="btn-secondary">
                                Contato
                            </a>
        
                        </div>
                    </div>
        
                    <div class="hero-image">
        
                        <img src="assets/img/perfil.png" alt="Foto de Eric">
    
                    </div>
                </div>
            </div>
        </section>
        <section id="sobre"></section>
        <section id="projetos"></section>
        <section id="contato"></section>
    </main>
    <footer></footer>
</body>
</html>
